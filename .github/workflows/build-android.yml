name: Build Auralis Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'public/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auralis-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Auralis web shell
        run: npx cap sync android

      - name: Install native Android screen-capture bridge
        run: |
          set -euo pipefail
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PACKAGE_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/$PACKAGE_PATH"
          mkdir -p "$JAVA_DIR"
          cat > "$JAVA_DIR/ScreenCapturePlugin.java" <<'JAVA'
          package com.ovarist.auralis;
          
          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import androidx.core.content.ContextCompat;
          
          @CapacitorPlugin(name = "ScreenCapture")
          public class ScreenCapturePlugin extends Plugin {
              private static final String ACTION_FRAME = "com.ovarist.auralis.SCREEN_FRAME";
              private static final String ACTION_STOPPED = "com.ovarist.auralis.SCREEN_STOPPED";
              private BroadcastReceiver receiver;
          
              @Override
              public void load() {
                  receiver = new BroadcastReceiver() {
                      @Override public void onReceive(Context context, Intent intent) {
                          if (ACTION_FRAME.equals(intent.getAction())) {
                              JSObject data = new JSObject();
                              data.put("frame", intent.getStringExtra("frame"));
                              data.put("width", intent.getIntExtra("width", 0));
                              data.put("height", intent.getIntExtra("height", 0));
                              notifyListeners("frame", data);
                          } else if (ACTION_STOPPED.equals(intent.getAction())) {
                              notifyListeners("stopped", new JSObject());
                          }
                      }
                  };
                  IntentFilter filter = new IntentFilter();
                  filter.addAction(ACTION_FRAME);
                  filter.addAction(ACTION_STOPPED);
                  ContextCompat.registerReceiver(getContext(), receiver, filter, ContextCompat.RECEIVER_NOT_EXPORTED);
              }
          
              @PluginMethod
              public void start(PluginCall call) {
                  Intent intent = ((android.media.projection.MediaProjectionManager) getContext()
                      .getSystemService(Context.MEDIA_PROJECTION_SERVICE)).createScreenCaptureIntent();
                  startActivityForResult(call, intent, "handleScreenCaptureResult");
              }
          
              @ActivityCallback
              private void handleScreenCaptureResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result == null || result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      call.reject("Screen capture permission was not granted");
                      return;
                  }
                  Intent service = new Intent(getContext(), ScreenCaptureService.class);
                  service.setAction(ScreenCaptureService.ACTION_START);
                  service.putExtra(ScreenCaptureService.EXTRA_RESULT_CODE, result.getResultCode());
                  service.putExtra(ScreenCaptureService.EXTRA_RESULT_DATA, result.getData());
                  try {
                      ContextCompat.startForegroundService(getContext(), service);
                      call.resolve();
                  } catch (Exception error) {
                      call.reject("Unable to start Android screen capture", error);
                  }
              }
          
              @PluginMethod
              public void stop(PluginCall call) {
                  Intent service = new Intent(getContext(), ScreenCaptureService.class);
                  service.setAction(ScreenCaptureService.ACTION_STOP);
                  getContext().startService(service);
                  call.resolve();
              }
          
              @Override
              protected void handleOnDestroy() {
                  if (receiver != null) {
                      try { getContext().unregisterReceiver(receiver); } catch (Exception ignored) {}
                      receiver = null;
                  }
                  super.handleOnDestroy();
              }
          }
          JAVA
          cat > "$JAVA_DIR/ScreenCaptureService.java" <<'JAVA'
          package com.ovarist.auralis;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.SystemClock;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          import androidx.core.app.NotificationCompat;
          import java.io.ByteArrayOutputStream;
          import java.nio.ByteBuffer;
          
          public class ScreenCaptureService extends Service {
              public static final String ACTION_START = "com.ovarist.auralis.START_SCREEN_CAPTURE";
              public static final String ACTION_STOP = "com.ovarist.auralis.STOP_SCREEN_CAPTURE";
              public static final String EXTRA_RESULT_CODE = "resultCode";
              public static final String EXTRA_RESULT_DATA = "resultData";
              private static final String CHANNEL_ID = "auralis-screen-capture";
              private static final int NOTIFICATION_ID = 4207;
              private static final String ACTION_FRAME = "com.ovarist.auralis.SCREEN_FRAME";
              private static final String ACTION_STOPPED = "com.ovarist.auralis.SCREEN_STOPPED";
          
              private MediaProjection projection;
              private VirtualDisplay virtualDisplay;
              private ImageReader imageReader;
              private HandlerThread workerThread;
              private Handler worker;
              private long lastFrameAt;
              private boolean stoppedBroadcastSent;
          
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null || ACTION_STOP.equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (!ACTION_START.equals(intent.getAction()) || projection != null) return START_NOT_STICKY;
                  startCaptureForeground();
                  int resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, 0);
                  Intent resultData = Build.VERSION.SDK_INT >= 33
                      ? intent.getParcelableExtra(EXTRA_RESULT_DATA, Intent.class)
                      : intent.getParcelableExtra(EXTRA_RESULT_DATA);
                  if (resultData == null) { stopSelf(); return START_NOT_STICKY; }
                  try {
                      MediaProjectionManager manager = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      projection = manager.getMediaProjection(resultCode, resultData);
                      if (projection == null) throw new IllegalStateException("MediaProjection unavailable");
                      DisplayMetrics metrics = new DisplayMetrics();
                      WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      wm.getDefaultDisplay().getRealMetrics(metrics);
                      int sourceWidth = Math.max(1, metrics.widthPixels);
                      int sourceHeight = Math.max(1, metrics.heightPixels);
                      float scale = Math.min(1f, Math.min(960f / sourceWidth, 540f / sourceHeight));
                      int width = Math.max(2, ((int) (sourceWidth * scale)) & ~1);
                      int height = Math.max(2, ((int) (sourceHeight * scale)) & ~1);
                      workerThread = new HandlerThread("AuralisScreenCapture");
                      workerThread.start();
                      worker = new Handler(workerThread.getLooper());
                      imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2);
                      imageReader.setOnImageAvailableListener(this::onImageAvailable, worker);
                      projection.registerCallback(new MediaProjection.Callback() {
                          @Override public void onStop() { stopSelf(); }
                      }, worker);
                      virtualDisplay = projection.createVirtualDisplay(
                          "Auralis screen share", width, height, metrics.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader.getSurface(), null, worker
                      );
                      if (virtualDisplay == null) throw new IllegalStateException("Unable to create virtual display");
                  } catch (Exception error) {
                      android.util.Log.e("AuralisScreenCapture", "Capture start failed", error);
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }
          
              private void startCaptureForeground() {
                  NotificationManager manager = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      manager.createNotificationChannel(new NotificationChannel(CHANNEL_ID, "Демонстрация экрана", NotificationManager.IMPORTANCE_LOW));
                  }
                  Intent stopIntent = new Intent(this, ScreenCaptureService.class).setAction(ACTION_STOP);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0);
                  PendingIntent stopPending = PendingIntent.getService(this, 1, stopIntent, flags);
                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(getApplicationInfo().icon)
                      .setContentTitle("Auralis — демонстрация экрана")
                      .setContentText("Экран передаётся собеседнику")
                      .setOngoing(true)
                      .setCategory(NotificationCompat.CATEGORY_SERVICE)
                      .addAction(0, "Остановить", stopPending)
                      .build();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(NOTIFICATION_ID, notification);
                  }
              }
          
              private void onImageAvailable(ImageReader reader) {
                  Image image = null;
                  try {
                      long now = SystemClock.elapsedRealtime();
                      if (now - lastFrameAt < 160) {
                          image = reader.acquireLatestImage();
                          return;
                      }
                      image = reader.acquireLatestImage();
                      if (image == null) return;
                      lastFrameAt = now;
                      Image.Plane plane = image.getPlanes()[0];
                      ByteBuffer buffer = plane.getBuffer();
                      int pixelStride = plane.getPixelStride();
                      int rowStride = plane.getRowStride();
                      int width = image.getWidth();
                      int height = image.getHeight();
                      int paddedWidth = rowStride / pixelStride;
                      Bitmap padded = Bitmap.createBitmap(paddedWidth, height, Bitmap.Config.ARGB_8888);
                      buffer.rewind();
                      padded.copyPixelsFromBuffer(buffer);
                      Bitmap frame = paddedWidth == width ? padded : Bitmap.createBitmap(padded, 0, 0, width, height);
                      ByteArrayOutputStream output = new ByteArrayOutputStream(48 * 1024);
                      frame.compress(Bitmap.CompressFormat.JPEG, 52, output);
                      byte[] bytes = output.toByteArray();
                      Intent broadcast = new Intent(ACTION_FRAME).setPackage(getPackageName());
                      broadcast.putExtra("frame", Base64.encodeToString(bytes, Base64.NO_WRAP));
                      broadcast.putExtra("width", width);
                      broadcast.putExtra("height", height);
                      sendBroadcast(broadcast);
                      if (frame != padded) frame.recycle();
                      padded.recycle();
                      output.close();
                  } catch (Exception error) {
                      android.util.Log.w("AuralisScreenCapture", "Frame encode failed", error);
                  } finally {
                      if (image != null) image.close();
                  }
              }
          
              @Override public void onDestroy() {
                  if (virtualDisplay != null) { virtualDisplay.release(); virtualDisplay = null; }
                  if (imageReader != null) { imageReader.close(); imageReader = null; }
                  if (projection != null) { projection.stop(); projection = null; }
                  if (workerThread != null) { workerThread.quitSafely(); workerThread = null; }
                  stopForeground(true);
                  if (!stoppedBroadcastSent) {
                      stoppedBroadcastSent = true;
                      sendBroadcast(new Intent(ACTION_STOPPED).setPackage(getPackageName()));
                  }
                  super.onDestroy();
              }
          
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          JAVA
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java -print -quit)
          if [ -z "$MAIN_ACTIVITY" ]; then echo "MainActivity.java not found"; exit 1; fi
          if ! grep -q 'ScreenCapturePlugin.class' "$MAIN_ACTIVITY"; then
            sed -i '/import com.getcapacitor.BridgeActivity;/a import android.os.Bundle;\nimport com.ovarist.auralis.ScreenCapturePlugin;' "$MAIN_ACTIVITY"
            sed -i 's/extends BridgeActivity {/extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(ScreenCapturePlugin.class);\n        super.onCreate(savedInstanceState);\n    }/' "$MAIN_ACTIVITY"
          fi
          echo "Installed native MediaProjection capture bridge"

      - name: Declare Android runtime permissions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(file, 'utf8');
          const permissions = [
            'android.permission.RECORD_AUDIO',
            'android.permission.MODIFY_AUDIO_SETTINGS',
            'android.permission.CAMERA',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION'
          ];
          for (const permission of permissions) {
            const tag = '<uses-permission android:name="' + permission + '" />';
            if (!xml.includes('android:name="' + permission + '"')) {
              xml = xml.replace(/<manifest\b[^>]*>/, match => match + '\n    ' + tag);
            }
          }
          const serviceTag = '<service android:name=".ScreenCaptureService" android:exported="false" android:foregroundServiceType="mediaProjection" />';
          if (!xml.includes('android:name=".ScreenCaptureService"')) {
            xml = xml.replace(/<application\b[^>]*>/, match => match + '\n        ' + serviceTag);
          }
          fs.writeFileSync(file, xml);
          console.log('Declared microphone, audio routing, camera and screen capture permissions');
          NODE

      - name: Apply desktop Auralis icon to Android launcher
        run: |
          set -euo pipefail
          command -v convert >/dev/null || { sudo apt-get update && sudo apt-get install -y imagemagick; }
          SOURCE="build/icon.png.jpg"
          test -s "$SOURCE"
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            mkdir -p "$RES/mipmap-$1"
            convert "$SOURCE" -auto-orient -resize "$2x$2^" -gravity center -extent "$2x$2" "$RES/mipmap-$1/ic_launcher.png"
            cp "$RES/mipmap-$1/ic_launcher.png" "$RES/mipmap-$1/ic_launcher_round.png"
          done
          convert "$SOURCE" -auto-orient -resize 324x324^ -gravity center -extent 324x324 "$RES/desktop-icon-inner.png"
          convert -size 432x432 xc:none "$RES/desktop-icon-inner.png" -gravity center -composite "$RES/drawable-nodpi/auralis_launcher_foreground.png"
          rm "$RES/desktop-icon-inner.png"
          cat > "$RES/values/auralis_icon_colors.xml" <<'XML'
          <resources><color name="auralis_launcher_background">#10182b</color></resources>
          XML
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/auralis_launcher_background"/>
              <foreground android:drawable="@drawable/auralis_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(file, 'utf8');
          xml = xml.replace(/<application\b[^>]*>/, tag => {
            tag = tag.replace(/\sandroid:icon="[^"]*"/, '').replace(/\sandroid:roundIcon="[^"]*"/, '');
            return tag.slice(0, -1) + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">';
          });
          fs.writeFileSync(file, xml);
          NODE
          echo "Applied the existing desktop Auralis artwork to Android launcher icons"
          
      - name: Set Android app version from package.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
          if (!match) throw new Error('Invalid semantic version: ' + version);
          const versionCode = Number(match[1]) * 10000 + Number(match[2]) * 100 + Number(match[3]);
          if (!Number.isSafeInteger(versionCode) || versionCode < 1) throw new Error('Invalid Android versionCode');
          const file = 'android/app/build.gradle';
          let gradle = fs.readFileSync(file, 'utf8');
          if (!/versionCode\s+\d+/.test(gradle) || !/versionName\s+['\"][^'\"]+['\"]/.test(gradle)) {
            throw new Error('Could not find versionCode/versionName in ' + file);
          }
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + versionCode);
          gradle = gradle.replace(/versionName\s+['\"][^'\"]+['\"]/, 'versionName "' + version + '"');
          fs.writeFileSync(file, gradle);
          console.log('Android version:', version, 'versionCode:', versionCode);
          NODE

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Give APK versioned and stable download filenames
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Auralis-Android-$VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Auralis-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-Android-APK
          path: |
            android/app/build/outputs/apk/debug/Auralis-Android-*.apk
            android/app/build/outputs/apk/debug/Auralis-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to the Android download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Auralis for Android (latest)
          body: |
            Latest installable Auralis Android APK.

            This is a directly installable debug-signed APK for testing and sideloading. Google Play publication is not included.
          prerelease: true
          make_latest: false
          files: |
            android/app/build/outputs/apk/debug/Auralis-Android-*.apk
            android/app/build/outputs/apk/debug/Auralis-Android.apk
          overwrite_files: true
