name: Build Auralis Windows Installer

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!README*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auralis-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build branded Windows installer
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\npm-cache
            ~\AppData\Local\electron-builder\Cache
          key: auralis-win-build-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            auralis-win-build-${{ runner.os }}-node22-

      - name: Install dependencies
        run: npm install --no-save --no-package-lock --prefer-offline --no-audit --no-fund sharp

      - name: Generate branded app and installer assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          node -e "require('sharp')('build/auralis-icon.svg').resize(512,512).png().toFile('build/auralis-icon.png').then(()=>console.log('Icon rendered'))"
          Add-Type -AssemblyName System.Drawing

          $image = [System.Drawing.Image]::FromFile((Resolve-Path "build/auralis-icon.png"))
          $bitmap = New-Object System.Drawing.Bitmap(256, 256)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
          $graphics.DrawImage($image, 0, 0, 256, 256)
          $graphics.Dispose()
          $image.Dispose()

          $stream = New-Object System.IO.MemoryStream
          $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Png)
          $png = $stream.ToArray()
          $stream.Dispose()
          $bitmap.Dispose()

          $file = [System.IO.File]::Open((Join-Path (Resolve-Path "build") "icon.ico"), [System.IO.FileMode]::Create)
          $writer = New-Object System.IO.BinaryWriter($file)
          $writer.Write([UInt16]0); $writer.Write([UInt16]1); $writer.Write([UInt16]1)
          $writer.Write([Byte]0); $writer.Write([Byte]0); $writer.Write([Byte]0); $writer.Write([Byte]0)
          $writer.Write([UInt16]1); $writer.Write([UInt16]32)
          $writer.Write([UInt32]$png.Length); $writer.Write([UInt32]22); $writer.Write($png)
          $writer.Close()
          $file.Dispose()

          $side = New-Object System.Drawing.Bitmap(164, 314, [System.Drawing.Imaging.PixelFormat]::Format24bppRgb)
          $g = [System.Drawing.Graphics]::FromImage($side)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $rect = New-Object System.Drawing.Rectangle(0,0,164,314)
          $brush = New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect,[System.Drawing.Color]::FromArgb(8,13,34),[System.Drawing.Color]::FromArgb(23,31,77),90)
          $g.FillRectangle($brush,$rect); $brush.Dispose()
          $g.FillEllipse((New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(30,91,91,255))),70,-45,145,145)
          $logo = [System.Drawing.Image]::FromFile((Resolve-Path "build/auralis-icon.png"))
          $g.DrawImage($logo,46,24,72,72); $logo.Dispose()
          $white = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(248,250,255))
          $muted = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(174,190,224))
          $accent = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(91,210,244))
          $fontTitle = New-Object System.Drawing.Font("Segoe UI",15,[System.Drawing.FontStyle]::Bold)
          $fontBody = New-Object System.Drawing.Font("Segoe UI",9,[System.Drawing.FontStyle]::Regular)
          $fontSmall = New-Object System.Drawing.Font("Segoe UI",8,[System.Drawing.FontStyle]::Bold)
          $g.DrawString("AURALIS",$fontTitle,$white,18,116)
          $g.FillRectangle($accent,18,151,38,3)
          $g.DrawString("Голос. Видео.",$fontBody,$white,18,174)
          $g.DrawString("Общение без границ.",$fontBody,$white,18,193)
          $g.DrawString("Установка приложения",$fontBody,$muted,18,235)
          $g.DrawString("AURALIS DESKTOP",$fontSmall,$accent,18,282)
          $fontTitle.Dispose(); $fontBody.Dispose(); $fontSmall.Dispose()
          $white.Dispose(); $muted.Dispose(); $accent.Dispose()
          $g.Dispose(); $side.Save("build/installer-sidebar.bmp",[System.Drawing.Imaging.ImageFormat]::Bmp); $side.Dispose()

          $header = New-Object System.Drawing.Bitmap(150,57,[System.Drawing.Imaging.PixelFormat]::Format24bppRgb)
          $hg = [System.Drawing.Graphics]::FromImage($header)
          $hg.Clear([System.Drawing.Color]::FromArgb(12,17,39))
          $hlogo = [System.Drawing.Image]::FromFile((Resolve-Path "build/auralis-icon.png"))
          $hg.DrawImage($hlogo,8,9,38,38); $hlogo.Dispose()
          $hfont = New-Object System.Drawing.Font("Segoe UI",13,[System.Drawing.FontStyle]::Bold)
          $hg.DrawString("Auralis",$hfont,(New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(245,248,255))),52,17)
          $hfont.Dispose(); $hg.Dispose()
          $header.Save("build/installer-header.bmp",[System.Drawing.Imaging.ImageFormat]::Bmp)
          $header.Dispose()
          Write-Host "Created Auralis icon and branded installer artwork."

      - name: Build Windows installer (NSIS)
        run: npm run build:nsis -- --publish never

      - name: Prepare stable Windows download filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/*.exe" | Where-Object { $_.Name -notmatch "uninstaller" } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer EXE was not produced" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $versionedPath = Join-Path (Resolve-Path "dist") "Auralis-Setup-$version.exe"
          if ([System.IO.Path]::GetFullPath($installer.FullName) -ne [System.IO.Path]::GetFullPath($versionedPath)) {
            Copy-Item $installer.FullName $versionedPath -Force
          }
          $latestPath = Join-Path (Resolve-Path "dist") "Auralis-Setup.exe"
          if ([System.IO.Path]::GetFullPath($installer.FullName) -ne [System.IO.Path]::GetFullPath($latestPath)) {
            Copy-Item $installer.FullName $latestPath -Force
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows installer download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Auralis for Windows (latest)
          body: Latest Auralis Windows installer.
          prerelease: true
          make_latest: false
          files: |
            dist/Auralis-Setup-*.exe
            dist/Auralis-Setup.exe
          overwrite_files: true
