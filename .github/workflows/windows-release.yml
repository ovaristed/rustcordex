name: Windows desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auralis-windows-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer and portable app
        run: npx electron-builder --win nsis portable --publish never

      - name: Verify updater metadata
        shell: pwsh
        run: |
          if (!(Test-Path "dist/latest.yml")) {
            throw "electron-builder did not create dist/latest.yml; refusing to publish an unusable auto-update release."
          }
          if (!(Get-ChildItem "dist" -Filter "*.exe" | Where-Object { $_.Name -like "Auralis-Setup-*" })) {
            throw "Windows NSIS installer was not created."
          }

      - name: Publish GitHub release for electron-updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Auralis v${{ steps.version.outputs.version }} (Windows)
          body: |
            Windows release built from the latest main branch.
            Includes the NSIS installer, portable build, and electron-updater metadata.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
