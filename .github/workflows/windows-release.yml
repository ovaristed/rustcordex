name: Windows desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auralis-windows-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies (retry transient Electron download failures)
        shell: pwsh
        run: |
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Dependency installation attempt $attempt of $maxAttempts"
            npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Dependencies installed successfully."
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              Write-Warning "npm install failed (exit $LASTEXITCODE). Waiting 30 seconds before retry."
              Start-Sleep -Seconds 30
            }
          }
          throw "npm install failed after $maxAttempts attempts."

      - name: Install SVG artwork renderer
        run: npm install --no-save --no-package-lock --prefer-offline --no-audit --no-fund sharp

      - name: Prepare Windows installer artwork from Auralis logo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          node -e "require('sharp')('build/auralis-icon.svg').resize(512,512).png().toFile('build/auralis-icon.png').then(()=>console.log('Auralis logo rendered'))"
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Join-Path $PWD "build/auralis-icon.png"))
          try {
            $iconBitmap = New-Object System.Drawing.Bitmap(256, 256)
            $graphics = [System.Drawing.Graphics]::FromImage($iconBitmap)
            try {
              $graphics.Clear([System.Drawing.Color]::FromArgb(7, 43, 25))
              $graphics.DrawImage($source, 0, 0, 256, 256)
              $hIcon = $iconBitmap.GetHicon()
              try {
                $icon = [System.Drawing.Icon]::FromHandle($hIcon)
                $stream = [System.IO.File]::Create((Join-Path $PWD "build/icon.ico"))
                try { $icon.Save($stream) } finally { $stream.Dispose() }
              } finally {
                Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeIcon {
            [DllImport("user32.dll", SetLastError=true)] public static extern bool DestroyIcon(IntPtr hIcon);
          }
          '@
                [NativeIcon]::DestroyIcon($hIcon) | Out-Null
              }
            } finally { $graphics.Dispose(); $iconBitmap.Dispose() }
            function Save-InstallerBitmap([int]$width, [int]$height, [string]$path, $image) {
              $bmp = New-Object System.Drawing.Bitmap($width, $height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              try {
                $g.Clear([System.Drawing.Color]::FromArgb(7, 43, 25))
                $g.DrawImage($image, 0, 0, $width, $height)
                $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Bmp)
              } finally { $g.Dispose(); $bmp.Dispose() }
            }
            Save-InstallerBitmap 164 314 (Join-Path $PWD "build/installer-sidebar.bmp") $source
            Save-InstallerBitmap 150 57 (Join-Path $PWD "build/installer-header.bmp") $source
          } finally { $source.Dispose() }

      - name: Build Windows installer and portable app
        run: npx electron-builder --win nsis portable --publish never

      - name: Verify updater metadata
        shell: pwsh
        run: |
          if (!(Test-Path "dist/latest.yml")) {
            throw "electron-builder did not create dist/latest.yml; refusing to publish an unusable auto-update release."
          }
          if (!(Get-ChildItem "dist" -Filter "*.exe" | Where-Object { $_.Name -like "Auralis-Setup-*" })) {
            throw "Windows NSIS installer was not created."
          }

      - name: Publish GitHub release for electron-updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Auralis v${{ steps.version.outputs.version }} (Windows)
          body: |
            Windows release built from the latest main branch.
            Includes the NSIS installer, portable build, and electron-updater metadata.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
