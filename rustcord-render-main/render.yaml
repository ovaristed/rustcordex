services:
  - type: web
    name: rustcord-server
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rustcord-db
          property: connectionString
      # TURN Relay servers (metered.ca or custom coturn)
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      # Optional GIF search keys
      - key: GIPHY_API_KEY
        sync: false
      - key: TENOR_API_KEY
        sync: false

databases:
  - name: rustcord-db
    plan: free
