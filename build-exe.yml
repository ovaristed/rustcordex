name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          cd desktop
          npm install

      - name: Prepare installer icon and sidebar assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/build" | Out-Null
          Add-Type -AssemblyName System.Drawing

          $iconFile = Get-ChildItem -Path "desktop/build" -Filter "icon.*" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -match '\.(png|jpg|jpeg|webp|bmp)$' } | Select-Object -First 1
          if ($iconFile) {
            Write-Host "Found icon source: $($iconFile.FullName)"
            $srcImg = [System.Drawing.Image]::FromFile($iconFile.FullName)
            $bmp256 = New-Object System.Drawing.Bitmap(256, 256)
            $g = [System.Drawing.Graphics]::FromImage($bmp256)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($srcImg, 0, 0, 256, 256)
            $g.Dispose()
            $srcImg.Dispose()

            $ms = New-Object System.IO.MemoryStream
            $bmp256.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            $pngBytes = $ms.ToArray()
            $ms.Dispose()
            $bmp256.Dispose()

            $fs = [System.IO.File]::Open((Join-Path (Resolve-Path "desktop/build") "icon.ico"), [System.IO.FileMode]::Create)
            $bw = New-Object System.IO.BinaryWriter($fs)
            $bw.Write([UInt16]0)
            $bw.Write([UInt16]1)
            $bw.Write([UInt16]1)
            $bw.Write([Byte]0)
            $bw.Write([Byte]0)
            $bw.Write([Byte]0)
            $bw.Write([Byte]0)
            $bw.Write([UInt16]1)
            $bw.Write([UInt16]32)
            $bw.Write([UInt32]$pngBytes.Length)
            $bw.Write([UInt32]22)
            $bw.Write($pngBytes)
            $bw.Close()
            $fs.Dispose()
            Write-Host "Generated desktop/build/icon.ico"
          } else {
            Write-Host "No custom icon image found in desktop/build"
          }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          cd desktop
          npx electron-builder --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rustcord-Windows-Installer
          path: desktop/dist/*.exe
