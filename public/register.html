<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090f">
<link rel="icon" href="/auralis-icon.svg" type="image/svg+xml">
<title>Регистрация · Auralis</title>
<style>
:root{color-scheme:dark;--bg:#07090f;--panel:rgba(18,22,33,.38);--border:rgba(225,237,250,.16);--text:#f3f6fc;--muted:rgba(230,236,255,.62);--accent:#0a84ff;--purple:#bf5af2;--green:#30d158;--red:#ff453a}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:28px 18px;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 18%,rgba(10,132,255,.20),transparent 42%),radial-gradient(circle at 85% 25%,rgba(191,90,242,.18),transparent 42%),radial-gradient(circle at 50% 95%,rgba(94,92,230,.13),transparent 42%),var(--bg)}
.mesh{position:fixed;inset:-15%;pointer-events:none;filter:blur(70px);opacity:.8;background:radial-gradient(ellipse at 30% 45%,rgba(94,92,230,.13),transparent 42%),radial-gradient(ellipse at 70% 35%,rgba(10,132,255,.14),transparent 42%);animation:mesh 16s ease-in-out infinite alternate}
@keyframes mesh{to{transform:scale(1.08);opacity:1}}
.auth-card{position:relative;width:min(440px,100%);padding:clamp(28px,6vw,46px);border-radius:28px;background:var(--panel);border:1px solid var(--border);border-top-color:rgba(255,255,255,.23);border-left-color:rgba(255,255,255,.20);backdrop-filter:blur(30px) saturate(175%);-webkit-backdrop-filter:blur(30px) saturate(175%);box-shadow:0 24px 80px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.07);animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:10px}
.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#0a84ff,#5e5ce6);box-shadow:0 8px 24px rgba(10,132,255,.28)}
.brand-mark svg{width:23px;height:23px}
.brand-name{font-size:30px;line-height:1;font-weight:760;letter-spacing:-.8px;background:linear-gradient(120deg,#48a5ff,#8b83ff 72%,#c18aff);background-clip:text;-webkit-background-clip:text;color:transparent}
h1{margin:23px 0 8px;text-align:center;font-size:24px;letter-spacing:-.5px}
.intro{margin:0 auto 28px;max-width:300px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55}
.field{margin:0 0 16px}
label{display:block;margin:0 0 8px 2px;font-size:12px;font-weight:650;color:rgba(243,246,252,.84)}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:15px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:rgba(230,236,255,.48);pointer-events:none}
input{display:block;width:100%;height:49px;padding:0 15px 0 44px;border-radius:14px;border:1px solid rgba(255,255,255,.12);outline:0;background:rgba(0,0,0,.22);color:var(--text);font:inherit;font-size:14px;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus{border-color:rgba(10,132,255,.9);background:rgba(0,0,0,.3);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
input::placeholder{color:rgba(230,236,255,.34)}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:49px;margin-top:9px;border:0;border-radius:14px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:white;font:650 14px inherit;cursor:pointer;box-shadow:0 8px 25px rgba(10,132,255,.25);transition:transform .18s,box-shadow .18s,opacity .18s}
.primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(10,132,255,.34)}
.primary:disabled{opacity:.6;cursor:wait;transform:none}
.primary svg{width:17px;height:17px}
.error{min-height:18px;margin:12px 0 0;color:#ff766e;text-align:center;font-size:12px;line-height:1.5}
.bottom{margin:20px 0 0;text-align:center;color:var(--muted);font-size:12px}
.bottom a{color:#68b4ff;text-decoration:none;font-weight:650}
.bottom a:hover{text-decoration:underline}
.security{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:23px;color:rgba(230,236,255,.4);font-size:10px}
.security svg{width:13px;height:13px}
@media(max-width:420px){body{padding:14px}.auth-card{padding:28px 22px;border-radius:23px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="mesh" aria-hidden="true"></div>
<main class="auth-card">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-6.5A2.5 2.5 0 0 1 4 11z"/><path d="M8 8h8M8 11.5h5"/></svg></span>
    <span class="brand-name">Auralis</span>
  </div>
  <h1>Создать аккаунт</h1>
  <p class="intro">Присоединяйся к Auralis — общайся, находи друзей и оставайся на связи.</p>
  <form id="registerForm" novalidate>
    <div class="field">
      <label for="username">Логин</label>
      <div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-1a7 7 0 0 1 14 0v1"/></svg><input id="username" name="username" autocomplete="username" placeholder="Придумай логин" minlength="3" maxlength="32" required></div>
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Создай пароль" minlength="6" required></div>
    </div>
    <div class="field">
      <label for="passwordConfirm">Повтори пароль</label>
      <div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="Введи пароль ещё раз" required></div>
    </div>
    <button class="primary" id="submitButton" type="submit"><span>Зарегистрироваться</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <div class="error" id="error" role="alert" aria-live="polite"></div>
  </form>
  <p class="bottom">Уже есть аккаунт? <a href="/">Войти</a></p>
  <div class="security"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/></svg>Защищённое соединение Auralis</div>
</main>
<script>
const form=document.getElementById('registerForm');
const errorEl=document.getElementById('error');
const button=document.getElementById('submitButton');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  errorEl.textContent='';
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const confirmation=document.getElementById('passwordConfirm').value;
  if(!username||!password)return errorEl.textContent='Заполни логин и пароль.';
  if(password.length<6)return errorEl.textContent='Пароль должен содержать не менее 6 символов.';
  if(password!==confirmation)return errorEl.textContent='Пароли не совпадают.';
  button.disabled=true;
  button.querySelector('span').textContent='Создаём аккаунт…';
  try{
    const response=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||'Не удалось создать аккаунт.');
    if(!data.token||!data.user)throw new Error('Сервер вернул неполный ответ.');
    localStorage.setItem('rc_token',data.token);
    window.location.replace('/');
  }catch(error){
    errorEl.textContent=error.message||'Сервер недоступен. Попробуй ещё раз.';
    button.disabled=false;
    button.querySelector('span').textContent='Зарегистрироваться';
  }
});
</script>
</body>
</html>
